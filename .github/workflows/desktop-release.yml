name: Build desktop installers

on:
  push:
    tags:
      - desktop-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Test, build, audit, and check the desktop boundary
        run: npm run verify:desktop

  bundle:
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            command: desktop:build:windows
            artifact: windows
          - platform: ubuntu-22.04
            command: desktop:build:linux
            artifact: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build offline desktop package
        run: npm run ${{ matrix.command }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bookrefinery-${{ matrix.artifact }}
          path: |
            release-artifacts/*.exe
            release-artifacts/*.AppImage
            release-artifacts/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bookrefinery-*
          path: release-artifacts
          merge-multiple: true

      - name: Give release assets stable download names
        run: |
          mv release-artifacts/BookRefinery-*-win-x64.exe release-artifacts/BookRefinery-Windows-x64.exe
          mv release-artifacts/BookRefinery-*-linux-x86_64.AppImage release-artifacts/BookRefinery-Linux-x86_64.AppImage
          mv release-artifacts/BookRefinery-*-linux-amd64.deb release-artifacts/BookRefinery-Linux-amd64.deb

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "BookRefinery Desktop ${GITHUB_REF_NAME#desktop-v}" \
            --latest \
            --notes "Bundled Windows and Linux editions. No WebView2 dependency, updater, telemetry, or application network access. The dedicated renderer is sandboxed and every remote request is denied. The app is unsigned; verify that the asset comes from this repository."
